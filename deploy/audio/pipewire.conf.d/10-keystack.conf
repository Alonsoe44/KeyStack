# KeyStack: installed to ~/.config/pipewire/pipewire.conf.d/ by deploy/audio.sh.
# The synth and the song player share one 48 kHz graph on the DAC.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    # FluidSynth asks for 64 frames; never go below that.
    default.clock.min-quantum   = 64
}
