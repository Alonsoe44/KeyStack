# KeyStack: installed to ~/.config/wireplumber/wireplumber.conf.d/ by
# deploy/audio.sh. Tunes the InnoMaker PCM5122 DAC HAT (ALSA card BossDAC).
monitor.alsa.rules = [
  {
    matches = [
      # "~" makes this a regular expression, e.g.
      # alsa_output.platform-soc_107c000000_sound.stereo-fallback
      { node.name = "~alsa_output\\.platform-soc_.*_sound\\..*" }
    ]
    actions = {
      update-props = {
        # Never suspend the DAC: no pop and no wake-up delay on the first note.
        session.suspend-timeout-seconds = 0
        # Small hardware buffer so the graph's quantum sets the latency.
        api.alsa.period-size = 64
        api.alsa.headroom    = 0
        # Make it the default sink, ahead of the Dummy Output.
        priority.session     = 2000
        priority.driver      = 2000
      }
    }
  }
]
